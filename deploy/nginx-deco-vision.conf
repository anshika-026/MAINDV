# /etc/nginx/sites-available/deco-vision  (symlink into sites-enabled)
# Serves the built SPA and proxies /api and /ws to the backend on the SAME
# origin, which is what the production frontend build expects
# (frontend/.env.production: VITE_API_BASE_URL=/api).
# TLS certificates: e.g. `sudo certbot --nginx -d vision.example.com`.

# http-context directive (this file is included inside `http {}`): log the
# path only ($uri), never the query string, which carries ?token= on websockets.
log_format deco_redacted '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

upstream deco_backend {
    server 127.0.0.1:8811;   # must match PORT in /etc/deco-vision/backend.env
    keepalive 16;
}

server {
    listen 80;
    server_name vision.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vision.example.com;

    ssl_certificate     /etc/letsencrypt/live/vision.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vision.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Uploads are capped at 5 MB by the backend; allow a little overhead.
    client_max_body_size 6m;

    access_log /var/log/nginx/deco-vision.access.log deco_redacted;

    root /home/ubuntu/Deco-vision/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://deco_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # model training / RTSP test can take a while
    }

    location /ws/ {
        proxy_pass http://deco_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # Liveness/readiness for monitoring, from the server itself only.
    location ~ ^/(health|ready)$ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://deco_backend;
    }
}
