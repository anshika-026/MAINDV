name: Deploy to vision.dewin.in

# Continuous deployment for https://vision.dewin.in (GCP VM 35.207.207.194).
#
# Runs automatically when the CI workflow finishes successfully for a push to
# main, and deploys exactly the commit CI tested. A failed or cancelled CI run
# never deploys. Can also be started by hand from the Actions tab.
#
# This is separate from deploy.yml (EC2, tag-based), which it does not affect.
#
# The deploy itself is ~/maindv-run/deploy.sh on the server: it checks out the
# commit, reinstalls dependencies only if they changed, rebuilds the frontend,
# restarts the backend, verifies /health and /ready, and rolls back on failure.
#
# Required secret:
#   secrets.VISION_DEPLOY_KEY   private SSH key whose public half is in the
#                               server's authorized_keys with a forced command
#                               (it can only run deploy.sh, nothing else).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vision-deploy
  cancel-in-progress: false   # never interrupt a deploy half way

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: vision
      url: https://vision.dewin.in
    env:
      HOST: 35.207.207.194
      USER_NAME: tarushi
      # Pinned server host key (public, from `ssh-keyscan -t ed25519`).
      HOST_KEY: "35.207.207.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGzemkSxXKQOPm7lG77n1PmIJewGkcPUFKHDCItabkK0"
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Deploy ${{ env.SHA }}
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.VISION_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "secrets.VISION_DEPLOY_KEY is not set"; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$HOST_KEY" > "$known_hosts"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          # The key's forced command runs deploy.sh; the only argument is the SHA.
          ssh -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -o ServerAliveInterval=30 \
            "${USER_NAME}@${HOST}" "$SHA"

      - name: Check the live site
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://vision.dewin.in/ || true)
            [ "$code" = 200 ] && { echo "https://vision.dewin.in is up (200)"; exit 0; }
            sleep 5
          done
          echo "https://vision.dewin.in returned $code"; exit 1
